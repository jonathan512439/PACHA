name: CI
on:
  push:
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      # Tipos de rutas de Next 16 (PageProps, LayoutProps, RouteContext): sin esto tsc falla en una copia limpia.
      - run: npx next typegen
      - run: npm run typecheck
      - run: npm test
      # Valida el JSON de tarjetas con el contrato (sin tocar la base: no hay secretos en CI)
      - run: npx tsx scripts/seed-lecciones.ts --validar
